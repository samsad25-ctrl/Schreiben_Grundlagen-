<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Wo geht's lang?</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital@0;1&family=Oswald:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f1e9;
      color: #111;
      font-family: "Libre Baskerville", serif;
    }

    .page {
      width: min(1380px, 94vw);
      margin: 0 auto;
      padding: 42px 0 60px;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      display: grid;
      grid-template-columns: repeat(12, 1fr);
      min-height: 330px;
      position: relative;

      padding-bottom: 45px;

      border-bottom: 1px solid #111;
    }

    .title {
      grid-column: 1 / 7;

      margin: 0;

      font-family: "Oswald", sans-serif;
      font-size: clamp(78px, 10vw, 145px);
      font-weight: 700;
      line-height: .78;
      letter-spacing: -.055em;
      text-transform: uppercase;
    }

    .chapter {
      grid-column: 10 / 13;
      align-self: end;

      text-align: right;
      padding-bottom: 10px;
    }

    .chapter-number {
      font-family: "Libre Baskerville", serif;
      font-size: 105px;
      line-height: .8;
    }

    .chapter-name {
      margin-top: 18px;

      font-family: "Oswald", sans-serif;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: .09em;
      text-transform: uppercase;
    }


    /* =========================
       MAIN SPREAD
    ========================= */

    .spread {
      display: grid;
      grid-template-columns:
        minmax(0, 2.25fr)
        minmax(260px, .75fr);

      border-bottom: 1px solid #111;
    }


    /* =========================
       MAP
    ========================= */

    .map-section {
      padding: 28px 30px 30px 0;
      border-right: 1px solid #111;
    }

    .map-label {
      display: flex;
      justify-content: space-between;
      align-items: baseline;

      margin-bottom: 18px;

      font-family: "Oswald", sans-serif;
      text-transform: uppercase;
    }

    .map-label strong {
      font-size: 22px;
      letter-spacing: .04em;
    }

    .map-label span {
      font-size: 12px;
      letter-spacing: .1em;
    }

    .map-frame {
      width: 100%;
      overflow: hidden;
    }

    .map-frame img {
      display: block;
      width: 100%;
      height: auto;
    }


    /* =========================
       PEOPLE
    ========================= */

    .people {
      display: grid;
      grid-template-rows: repeat(3, 1fr);
    }

    .person {
      display: grid;
      grid-template-columns: 44% 56%;

      min-height: 245px;

      border-bottom: 1px solid #111;
    }

    .person:last-child {
      border-bottom: none;
    }

    .portrait {
      overflow: hidden;
    }

    .portrait img {
      display: block;

      width: 100%;
      height: 100%;

      object-fit: cover;
      object-position: center;

      filter:
        grayscale(100%)
        contrast(1.12);
    }

    /* Harry: Bildausschnitt weiter nach rechts */
    .person:nth-child(3) .portrait img {
      object-position: 100% center;
    }

    .person-info {
      display: flex;
      flex-direction: column;
      justify-content: space-between;

      padding: 22px 18px;
    }

    .person-number {
      font-family: "Libre Baskerville", serif;
      font-size: 22px;
      line-height: 1;
    }

    .name {
      margin: auto 0 18px;

      font-family: "Oswald", sans-serif;
      font-size: clamp(32px, 3vw, 48px);
      font-weight: 600;
      line-height: .95;
      text-transform: uppercase;
    }


    /* =========================
       AUDIO BUTTON
    ========================= */

    .play {
      padding: 0;

      border: none;
      background: none;

      color: #111;

      font-family: "Oswald", sans-serif;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: .07em;
      text-transform: uppercase;

      text-align: left;
      cursor: pointer;
    }

    .play::before {
      content: "▶";
      margin-right: 9px;
    }

    .play.playing::before {
      content: "■";
    }

    .play:hover {
      font-style: italic;
    }

    audio {
      display: none;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      display: flex;
      justify-content: space-between;
      gap: 30px;

      margin-top: 24px;
      padding-top: 14px;

      border-top: 1px solid #111;

      font-family: "Oswald", sans-serif;
      font-size: 12px;
      letter-spacing: .1em;
      text-transform: uppercase;
    }


    /* =========================
       TABLET
    ========================= */

    @media (max-width: 850px) {

      .page {
        width: 92vw;
        padding-top: 30px;
      }

      .header {
        min-height: 280px;
      }

      .title {
        grid-column: 1 / 9;
      }

      .chapter {
        grid-column: 9 / 13;
      }

      .chapter-number {
        font-size: 75px;
      }

      .spread {
        display: block;
      }

      .map-section {
        padding: 25px 0 35px;

        border-right: none;
        border-bottom: 1px solid #111;
      }

      .person {
        min-height: 220px;
        grid-template-columns: 40% 60%;
      }
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 520px) {

      .header {
        display: block;

        min-height: auto;
        padding-bottom: 35px;
      }

      .title {
        margin-bottom: 50px;
        font-size: 72px;
      }

      .chapter {
        text-align: left;
      }

      .chapter-number {
        font-size: 65px;
      }

      .person {
        grid-template-columns: 45% 55%;
        min-height: 190px;
      }

      .name {
        font-size: 32px;
      }
    }

  </style>
</head>


<body>

<main class="page">


  <!-- HEADER -->

  <header class="header">

    <h1 class="title">
      Wo<br>
      geht's<br>
      lang?
    </h1>

    <div class="chapter">
      <div class="chapter-number">03</div>
      <div class="chapter-name">
        Wegbeschreibung
      </div>
    </div>

  </header>


  <!-- MAP + PEOPLE -->

  <section class="spread">


    <!-- MAP -->

    <div class="map-section">

      <div class="map-label">
        <strong>Stadtplan</strong>
        <span>
          Hören · Orientieren · Einzeichnen
        </span>
      </div>

      <div class="map-frame">
        <img
          src="Stadtplan_redo.png"
          alt="Stadtplan für die Wegbeschreibung"
        >
      </div>

    </div>


    <!-- PEOPLE -->

    <div class="people">


      <!-- ABE -->

      <article class="person">

        <div class="portrait">
          <img
            src="Abe.jpg"
            alt="Abe"
          >
        </div>

        <div class="person-info">

          <div class="person-number">
            01
          </div>

          <h2 class="name">
            Abe
          </h2>

          <button
            class="play"
            type="button"
            data-audio="abe"
          >
            Hören
          </button>

          <audio
            id="abe"
            preload="metadata"
            src="Abe.mp3"
          ></audio>

        </div>

      </article>


      <!-- EMMA -->

      <article class="person">

        <div class="portrait">
          <img
            src="Emma.jpg"
            alt="Emma"
          >
        </div>

        <div class="person-info">

          <div class="person-number">
            02
          </div>

          <h2 class="name">
            Emma
          </h2>

          <button
            class="play"
            type="button"
            data-audio="emma"
          >
            Hören
          </button>

          <audio
            id="emma"
            preload="metadata"
            src="Emma.mp3"
          ></audio>

        </div>

      </article>


      <!-- HARRY -->

      <article class="person">

        <div class="portrait">
          <img
            src="Harry.jpg"
            alt="Harry"
          >
        </div>

        <div class="person-info">

          <div class="person-number">
            03
          </div>

          <h2 class="name">
            Harry
          </h2>

          <button
            class="play"
            type="button"
            data-audio="harry"
          >
            Hören
          </button>

          <audio
            id="harry"
            preload="metadata"
            src="Harry.mp3"
          ></audio>

        </div>

      </article>


    </div>

  </section>


  <!-- FOOTER -->

  <footer class="footer">

    <span>
      Deutsch · Schreibkurs
    </span>

    <span>
      03 · Wegbeschreibung
    </span>

  </footer>


</main>


<script>

  const buttons =
    document.querySelectorAll(".play");

  const audios =
    document.querySelectorAll("audio");


  buttons.forEach(button => {

    button.addEventListener(
      "click",
      async () => {

        const audio =
          document.getElementById(
            button.dataset.audio
          );

        if (!audio) {
          return;
        }


        /* Andere Audios stoppen */

        audios.forEach(otherAudio => {

          if (otherAudio !== audio) {
            otherAudio.pause();
            otherAudio.currentTime = 0;
          }

        });


        /* Andere Buttons zurücksetzen */

        buttons.forEach(otherButton => {

          if (otherButton !== button) {
            otherButton.classList.remove(
              "playing"
            );

            otherButton.textContent =
              "Hören";
          }

        });


        /* Aktuelles Audio */

        if (audio.paused) {

          try {

            await audio.play();

            button.classList.add(
              "playing"
            );

            button.textContent =
              "Stop";

          } catch (error) {

            console.error(
              "Audio konnte nicht abgespielt werden:",
              error
            );

          }

        } else {

          audio.pause();

          button.classList.remove(
            "playing"
          );

          button.textContent =
            "Hören";

        }

      }
    );


    /* Passendes Audio */

    const audio =
      document.getElementById(
        button.dataset.audio
      );

    if (audio) {

      audio.addEventListener(
        "ended",
        () => {

          button.classList.remove(
            "playing"
          );

          button.textContent =
            "Hören";

        }
      );

    }

  });

</script>

</body>
</html>
