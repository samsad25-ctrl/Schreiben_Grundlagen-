<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Schreiben · Grundlagen</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f1e9;
      color: #111;
      font-family: "Oswald", sans-serif;
    }

    main {
      width: min(1200px, 92vw);
      margin: 0 auto;
      padding: 60px 0 80px;
    }

    header {
      min-height: 320px;
      border-bottom: 1px solid #111;
      display: flex;
      align-items: flex-end;
      padding-bottom: 35px;
    }

    h1 {
      margin: 0;
      font-size: clamp(70px, 11vw, 150px);
      line-height: .85;
      letter-spacing: -.04em;
      text-transform: uppercase;
    }

    .nav {
      margin-top: 60px;
    }

    .item {
      display: grid;
      grid-template-columns: 120px 1fr auto;
      align-items: center;
      gap: 30px;

      padding: 30px 0;
      border-bottom: 1px solid #111;

      color: #111;
      text-decoration: none;
    }

    .number {
      font-family: "Libre Baskerville", serif;
      font-size: 65px;
      line-height: 1;
    }

    .title {
      font-size: clamp(28px, 4vw, 52px);
      font-weight: 600;
      text-transform: uppercase;
    }

    .arrow {
      font-size: 35px;
    }

    .item:hover .title {
      font-style: italic;
    }

    footer {
      margin-top: 80px;
      padding-top: 15px;
      border-top: 1px solid #111;
      font-size: 12px;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    @media (max-width: 650px) {
      .item {
        grid-template-columns: 65px 1fr auto;
        gap: 15px;
      }

      .number {
        font-size: 42px;
      }
    }
  </style>
</head>

<body>

<main>

  <header>
    <h1>
      Schreiben<br>
      Grundlagen
    </h1>
  </header>

  <nav class="nav">

    <a class="item" href="01-selbstvorstellung/">
      <span class="number">01</span>
      <span class="title">Selbstvorstellung</span>
      <span class="arrow">→</span>
    </a>

    <a class="item" href="02-einladung/">
      <span class="number">02</span>
      <span class="title">Einladung</span>
      <span class="arrow">→</span>
    </a>

  </nav>

  <footer>
    Deutsch · Schreibkurs · SZTU
  </footer>

</main>

</body>
</html>
